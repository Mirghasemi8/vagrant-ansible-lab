---
- name: Install & Run Docker on Nodes
  hosts: nodes
  become: true
  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
    - name: Run Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Add vagrant user to docker group
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true
